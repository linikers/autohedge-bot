<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoHedge — Paper tracker</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 24px; background: #0f1115; color: #e6e6e6; }
  @media (prefers-color-scheme: light) {
    body { background: #fafafa; color: #111; }
    .sub, .kpi .l, th, .note, .muted { color: #5b6472; }
    .note { border-left-color: #d8d8d8; }
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8a8a8a; font-size: 12px; margin-bottom: 18px; }
  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .kpi { border: 1px solid #2a2d35; border-radius: 10px; padding: 10px 14px; min-width: 130px; }
  @media (prefers-color-scheme: light) { .kpi { border-color: #ddd; } }
  .kpi .l { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #8a8a8a; }
  .kpi .v { font-size: 20px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; max-width: 820px; font-size: 13px; margin: 8px 0 20px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #2a2d35; }
  @media (prefers-color-scheme: light) { th, td { border-color: #e2e2e2; } }
  th { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #8a8a8a; font-weight: 600; }
  .pos { color: #3fb950; } .neg { color: #f85149; } .muted { color: #8a8a8a; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #8a8a8a; margin: 22px 0 2px; }
  .note { font-size: 12px; color: #8a8a8a; max-width: 820px; border-left: 2px solid #2a2d35; padding-left: 10px; }
  .err { color: #f85149; font-size: 13px; }
</style>
</head>
<body>
<h1>AutoHedge — Paper tracker</h1>
<div class="sub" id="sub">carregando…</div>
<div class="kpis" id="kpis"></div>
<h2>Acerto por horizonte (vs benchmark do mesmo mix)</h2>
<table id="t-horizons"></table>
<h2>Últimas decisões liquidadas</h2>
<table id="t-recent"></table>
<div class="note" id="note"></div>

<script>
const fmt = (n, d = 2) => (n === null || n === undefined) ? "—" : Number(n).toFixed(d);
const cls = n => n > 0 ? "pos" : (n < 0 ? "neg" : "muted");

async function main() {
  let s;
  try {
    const r = await fetch("paper_stats.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    s = await r.json();
  } catch (e) {
    document.getElementById("sub").innerHTML = '<span class="err">paper_stats.json não encontrado — rode <code>python -m autohedge.paper_tracker run</code></span>';
    return;
  }

  const c = s.corpus || {}, rec = s.records || {};
  document.getElementById("sub").textContent =
    `atualizado ${s.generated_at || "?"} · ${c.analyses || 0} análises · ${rec.total || 0} decisões registradas`;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="l">decisões</div><div class="v">${(c.buy || 0) + (c.sell || 0)}</div><div class="l">${c.buy || 0} compra · ${c.sell || 0} venda</div></div>
    <div class="kpi"><div class="l">hold</div><div class="v">${c.hold || 0}</div></div>
    <div class="kpi"><div class="l">liquidadas 24h</div><div class="v">${rec.settled_24h || 0}</div></div>`;

  const H = s.by_horizon || {};
  let rows = "<tr><th>horizonte</th><th>n</th><th>acerto</th><th>esperado</th><th>edge</th><th>markout</th><th>p</th><th>n (sem sobreposição)</th></tr>";
  for (const h of ["1h", "4h", "24h"]) {
    const v = H[h];
    if (!v) { rows += `<tr><td>${h}</td><td colspan="7" class="muted">sem dados liquidados</td></tr>`; continue; }
    const no = v.non_overlapping || {};
    rows += `<tr>
      <td>${h}</td><td>${v.n}</td><td>${fmt(v.hit_pct, 1)}%</td><td class="muted">${fmt(v.expected_pct, 1)}%</td>
      <td class="${cls(v.edge_pp)}">${v.edge_pp > 0 ? "+" : ""}${fmt(v.edge_pp, 1)} pp</td>
      <td class="${cls(v.markout_pct)}">${v.markout_pct > 0 ? "+" : ""}${fmt(v.markout_pct, 3)}%</td>
      <td>${fmt(v.p_value, 2)}</td>
      <td class="muted">n=${no.n || 0} · ${fmt(no.hit_pct, 1)}%</td></tr>`;
  }
  document.getElementById("t-horizons").innerHTML = rows;

  let rr = "<tr><th>quando</th><th>ação</th><th>preço</th><th>1h</th><th>4h</th><th>24h</th></tr>";
  for (const r of (s.recent || [])) {
    const cell = k => r[k] === undefined ? '<span class="muted">—</span>'
      : `<span class="${cls(r[k])}">${r[k] > 0 ? "+" : ""}${fmt(r[k], 2)}%</span>`;
    rr += `<tr><td>${(r.ts || "").replace("T", " ").replace("Z", "")}</td>
      <td>${r.action === "buy" ? "compra" : "venda"}</td><td>${fmt(r.price)}</td>
      <td>${cell("markout_1h")}</td><td>${cell("markout_4h")}</td><td>${cell("markout_24h")}</td></tr>`;
  }
  document.getElementById("t-recent").innerHTML = rr;
  document.getElementById("note").textContent = s.note || "";
}
main();
</script>
</body>
</html>
